name: Deliver verified research backend image

# A network fallback for this deployment. The temporary SSH key is restricted
# server-side to writing one staging archive and is removed after delivery.
on:
  push:
    branches: [codex/research-execution-p0-p1]
    paths: [.github/workflows/deliver-research-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deliver-research-image
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_REF: ghcr.io/rocwangtime/quantdinger-backend@sha256:71006d6a58d366606602852548b18dfb9d802536d1aa56ca40608733f9710de9
      IMAGE_TAG: ghcr.io/rocwangtime/quantdinger-backend:sha-2a047d0
      EXPECTED_REVISION: 2a047d0db09ce1eb1eafe7e1c5f92b1083c3e229
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout the exact application revision
        uses: actions/checkout@v7
        with:
          ref: 2a047d0db09ce1eb1eafe7e1c5f92b1083c3e229

      - name: Download and verify published amd64 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$IMAGE_REF"
          test "$(docker image inspect --format '{{.Architecture}}' "$IMAGE_REF")" = amd64
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_REF")" = "$EXPECTED_REVISION"
          mkdir -p "$RUNNER_TEMP/research-release/source" "$RUNNER_TEMP/research-release/wheels"
          git archive HEAD backend_api_python | tar -xf - --strip-components=1 -C "$RUNNER_TEMP/research-release/source"
          docker run --rm --entrypoint python \
            -v "$RUNNER_TEMP/research-release/wheels:/export" "$IMAGE_REF" \
            -m pip download --index-url https://pypi.org/simple --only-binary=:all: --no-deps \
            --dest /export ccxt==4.5.85 litellm==1.93.2 PyJWT==2.15.1 pypdf==6.19.0 urllib3==2.8.0
          python3 - "$RUNNER_TEMP/research-release/wheels" <<'PY'
          import hashlib, json, pathlib, sys, urllib.request
          for path in pathlib.Path(sys.argv[1]).glob('*.whl'):
              name, version = path.name.split('-')[:2]
              with urllib.request.urlopen(f'https://pypi.org/pypi/{name}/{version}/json') as response:
                  document = json.load(response)
              expected = next(item['digests']['sha256'] for item in document['urls'] if item['filename'] == path.name)
              assert hashlib.sha256(path.read_bytes()).hexdigest() == expected, path.name
              print('Verified official wheel SHA-256:', path.name)
          PY
          tar -czf "$RUNNER_TEMP/research-release.tar.gz" -C "$RUNNER_TEMP/research-release" .
          sha256sum "$RUNNER_TEMP/research-release.tar.gz"
          split -n 8 -d "$RUNNER_TEMP/research-release.tar.gz" "$RUNNER_TEMP/research-part"

      - name: Deliver staging archive over restricted SSH
        shell: bash
        env:
          UPLOAD_KEY: ${{ secrets.RESEARCH_IMAGE_UPLOAD_KEY }}
          KNOWN_HOSTS: ${{ secrets.RESEARCH_IMAGE_UPLOAD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$UPLOAD_KEY"
          test -n "$KNOWN_HOSTS"
          key_path="$RUNNER_TEMP/image-upload-key"
          hosts_path="$RUNNER_TEMP/image-upload-known-hosts"
          trap 'rm -f "$key_path" "$hosts_path"' EXIT
          printf '%s\n' "$UPLOAD_KEY" > "$key_path"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts_path"
          uploads=()
          for number in $(seq 0 7); do
            part=$(printf '%02d' "$number")
            ssh -T -i "$key_path" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$hosts_path" -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
              ubuntu@106.55.138.232 "upload-research-2a047d0-part$number" < "$RUNNER_TEMP/research-part$part" &
            uploads+=("$!")
          done
          for upload in "${uploads[@]}"; do wait "$upload"; done
          echo 'Verified incremental release delivered to fixed server staging paths.'
